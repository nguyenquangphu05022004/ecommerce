version: "3.1"  # Adjust version if needed
services:
  mysql_db:
    image: mysql:8.0
    volumes:
      - mydata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
  ecommerce-app:
    image: mahiru050204/ecommerce_v5:1.0
    ports:
      - 80:8081
  phpmyadmin:
    image: phpmyadmin
    ports:
      - 8085:80
    environment:
      - PMA_HOST=mysql_db
    depends_on:
      - mysql_db
volumes:
  uploadsImage: